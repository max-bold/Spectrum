[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioanalysis"
version = "0.1.0"
description = "Reusable audio signal generation and analysis primitives."
readme = "docs/audioanalysis.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "sounddevice",
]

[project.optional-dependencies]
plot = ["matplotlib"]
io = ["soundfile"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["audioanalysis*"]
