[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioanalysis"
version = "0.1.0"
description = "Reusable audio signal generation and analysis primitives."
readme = "docs/audioanalysis.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.0",
    "scipy>=1.18.0",
    "sounddevice>=0.5.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.11.0"]
io = ["soundfile>=0.14.0"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["audioanalysis*"]
